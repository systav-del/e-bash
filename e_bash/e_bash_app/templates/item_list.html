<main class="countainer" id="item">
    {% for news in item_list %}
    <div class="row news-countainer" onclick="window.location={{ news.id }};">
        <div class="col-12">
            <h6>{{ news.news_title }}</h6>
            <p>{{ news.news_subtitle }}</p>
        </div>
    </div>
    {% endfor %}
</main>
